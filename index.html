<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atrapa los mangos de Dayana</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="inicio">
      <h2>Atrapa los mangos de Dayana</h2>
      <p>Ayuda a Dayana a atrapar los mangos<br>Evita los chocolates (¡van muy rápido!)<br>Tienes 3 vidas</p>
      <button id="btn-jugar" onclick="iniciar()">Jugar</button>
    </div>

    <div id="hud" style="display:none;">
      <span id="vidas-txt">🐾🐾🐾</span>
      <span id="puntos-txt">0 pts</span>
    </div>

    <canvas id="canvas"></canvas>

    <div id="overlay" style="display:none;">
      <img src="perro.svg" alt="perro peludo">
      <div id="overlay-txt">Game over, Dayana</div>
      <div id="overlay-sub"></div>
      <button id="btn-reiniciar" onclick="reiniciar()">Intentar de nuevo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
